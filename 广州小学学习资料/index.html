<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 版本号 v=1.2.0：每次改动资源后递增，避免浏览器把新旧脚本混用导致模块错乱 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="广州小学 1—4 年级语文、数学、英语同步学习资料：课前预习、生字笔顺、课后复习、课本跟读、课文原文、口算闯关、通关挑战，支持中英文语音朗读。">
  <title>穗学伴 · 广州小学同步学习资料</title>
  <link rel="stylesheet" href="css/style.css?v=1.2.0">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar"></header>
      <div id="content"></div>
    </main>
  </div>
  <div id="modal-root"></div>

  <!-- 配置层：学段 / 学科 / 教材目录 / 扩展骨架 -->
  <script src="js/config.js?v=1.2.0"></script>
  <!-- 数据层：精编单元学习内容（46 个单元） -->
  <script src="js/data-core.js?v=1.2.0"></script>
  <script src="js/data-english.js?v=1.2.0"></script>
  <script src="js/data-text.js?v=1.2.0"></script>
  <!-- 初始化补充：为缺内置文本的单元补齐可跟读内容（古诗文 / 原创配套短文） -->
  <script src="js/data-text-init.js?v=1.2.0"></script>
  <!-- 离线汉字数据：165 个精编生字 + 602 个课本目录标题汉字（笔顺 / 拼音 / 组词） -->
  <script src="js/stroke-data.js?v=1.2.0"></script>
  <script src="js/hanzi-meta.js?v=1.2.0"></script>
  <script src="js/hanzi-extra.js?v=1.2.0"></script>
  <!-- 其余目录条目的「基础学习内容」生成器：让每一课都有六大模块可用内容 -->
  <script src="js/data-basic.js?v=1.2.0"></script>
  <!-- 引擎层：语音合成 / 笔顺动画 / 口算出题 -->
  <script src="js/speech.js?v=1.2.0"></script>
  <script src="vendor/hanzi-writer.min.js?v=1.2.0"></script>
  <script src="js/strokes.js?v=1.2.0"></script>
  <script src="js/math-drill.js?v=1.2.0"></script>
  <!-- 引擎层：答题音效（Web Audio 即时合成，答对/答错声音提示） -->
  <script src="js/sound.js?v=1.2.0"></script>
  <!-- 应用层：渲染与交互，扩展内容时无需改动 -->
  <script src="js/app.js?v=1.2.0"></script>

  <!-- 缓存自检：若浏览器混用了新旧脚本，给出明确提示，避免显示串科的错乱页面 -->
  <script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      var EXPECTED = '1.2.0';
      var C = window.APP_CONFIG;
      var content = document.getElementById('content');
      var tabsBox = document.querySelector('.module-tabs');
      var bad = !C || C.version !== EXPECTED || !window.BasicData ||
                !window.HANZI_PINYIN || !content || !content.children.length;
      /* 锁定占位页本来就没有模块标签，属于正常情况，跳过比对 */
      if (!bad && tabsBox) {
        var btn = document.querySelector('.subject-btn.on');
        var sid = btn ? btn.getAttribute('data-v') : 'chinese';
        var expected = C.modulesFor ? C.modulesFor(sid).length : 0;
        bad = expected < 1 || tabsBox.querySelectorAll('.module-tab').length !== expected;
      }
      if (!bad) return;
      var bar = document.createElement('div');
      bar.id = 'cache-warn';
      bar.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 16px;background:#fff3cd;border-bottom:1px solid #f0c36d;color:#7a4b00;font-size:13px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)');
      bar.textContent = '检测到页面脚本版本不一致（浏览器缓存了旧文件）。请按 Ctrl + F5 强制刷新，或关闭本页后重新打开。';
      document.body.appendChild(bar);
    }, 500);
  });
  </script>
</body>
</html>
